services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  erp:
    build: { context: ., dockerfile: apps/erp/Dockerfile }
    env_file: [.env]
    environment:
      ERP_DATABASE_URL: ${ERP_DATABASE_URL}
    ports: ["4000:4000"]
    depends_on:
      mysql: { condition: service_healthy }
    command: ["sh", "-c", "npm -w packages/erp-db run db:deploy && npm -w packages/erp-db run db:seed && node apps/erp/dist/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/store-api/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      erp: { condition: service_healthy }
    command: ["sh", "-c", "npm -w packages/store-db run db:deploy && npm -w packages/store-db run db:seed && node apps/store-api/dist/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: { context: ., dockerfile: apps/store-api/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      api: { condition: service_healthy }
      erp: { condition: service_healthy }
    command: ["node", "apps/store-api/dist/worker.js"]

  web:
    build: { context: ., dockerfile: apps/store-web/Dockerfile }
    env_file: [.env]
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pg_data:
  mysql_data:
